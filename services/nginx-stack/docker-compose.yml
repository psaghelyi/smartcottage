name: nginx-stack

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    network_mode: host
    environment:
      - TZ=Europe/Budapest
    logging:
      driver: gelf
      options:
        gelf-address: udp://localhost:12201
        tag: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/etc/nginx/static:ro
      - ./.config/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - ./.config/certbot/conf:/etc/nginx/ssl:ro
      - ./.config/certbot/www:/var/www/certbot:rw
    depends_on:
      - certbot

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: "no"
    environment:
      - TZ=Europe/Budapest
    volumes:
      - ./.config/certbot/www:/var/www/certbot:rw
      - ./.config/certbot/conf:/etc/letsencrypt:rw
      - ./.config/certbot/log:/var/log/letsencrypt:rw
      - ./.config/certbot/lib:/var/lib/letsencrypt:rw
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

